# ---------------------------------------------------------------------------
# Stage 2 + VCP screener configuration.
# Every threshold the screener uses lives here; nothing is hard-coded.
# ---------------------------------------------------------------------------

universe:
  # Which listing venues to keep. Matches the exchange codes in the
  # nasdaqtrader.com symbol directory files.
  exchanges: [NASDAQ, NYSE, NYSE MKT, NYSE ARCA, BATS, IEX]
  exclude_etfs: true
  exclude_test_issues: true
  # Drop obvious non-common-stock instruments (warrants, units, rights, prefs).
  exclude_suffixed: true
  min_price: 5.0
  # Drop symbols whose newest bar lags the market's newest session by more than
  # this many calendar days. A delisted or halted stock keeps its cached
  # history and would otherwise be screened as if its last close were today's.
  max_staleness_days: 7
  # A symbol needs at least this many daily bars to be evaluated at all
  # (200MA + 20-day slope lookback + slack).
  min_history_days: 260
  # Cap the universe for debugging. 0 = no cap.
  limit: 0

data:
  # Calendar days of history to keep per symbol.
  history_days: 800
  benchmark: SPY
  # Inferred split back-adjustment is OFF.
  #
  # It cannot be done safely from price and volume alone. Checked against an
  # independent source, HTCO's 2025-03-24 halving (47.00 -> 23.50) still steps
  # in that source's *adjusted* close, meaning it was a real 50% fall - yet the
  # detector rescaled it, fabricating a smooth chart for a stock that crashed.
  # A missed split makes a stock fail the screen; a fabricated one can make a
  # collapsed stock pass it. The second error is far worse, so detection now
  # only reports.
  adjust_splits: false
  # Keyless sources that work from CI. Stooq serves a JavaScript browser
  # challenge and Yahoo blocks datacenter IP ranges, so neither is usable.
  providers: [nasdaq, stockanalysis]   # tried in order, per symbol
  max_workers: 6
  request_timeout: 20
  retries: 3

# ---------------------------------------------------------------------------
# Stage 2 trend template (criteria 1-5 from the brief, plus the TradingView
# filters 1-6 that reproduce the manual screen).
# ---------------------------------------------------------------------------
stage2:
  ma_short: 50
  ma_mid: 150
  ma_long: 200

  # Criterion 2: both the 150MA and the 200MA must be sloping up. Measured as
  # "the MA today is above the MA this many trading days ago".
  slope_lookback_days: 20
  # Require a minimum slope, in percent, over that lookback. 0 = any rise.
  min_slope_pct: 0.0

  # Criterion 5 / weekly candles: count green vs red weeks over this window.
  weekly_lookback_weeks: 52
  # Green week = weekly close > weekly open.
  require_more_up_weeks: true

  # TradingView filter 6.
  beta:
    lookback_days: 252
    min_beta: 1.0

  # TradingView filter 5: monthly volume x price.
  liquidity:
    dollar_volume_days: 21
    aggregate: sum              # sum | mean
    min_dollar_volume: 900000000

  # TradingView filter 4. 0 disables the market-cap floor (dollar volume is
  # doing the work instead).
  min_market_cap: 0

# ---------------------------------------------------------------------------
# VCP: a run of consolidations, each tighter than the last, on falling volume.
# ---------------------------------------------------------------------------
vcp:
  # How far back to look for the base.
  base_lookback_days: 130

  # Swing detection. A swing is confirmed once price reverses this far off an
  # extreme, and swings must be at least min_swing_bars apart.
  zigzag_pct: 3.0
  min_swing_bars: 3

  # Criterion 3: at least T2, better T3. More consolidations means less supply
  # left and a stronger move out.
  min_contractions: 2
  preferred_contractions: 3

  # Criterion 4: the pattern should run more than about three months from the
  # start of the first consolidation - the longer the shakeout, the more
  # thoroughly sellers have left. The hard floor only rejects bases too short
  # to mean anything; the preferred level is the three months.
  min_base_bars: 20
  preferred_base_bars: 63
  # How many consolidations may make up one base. Bases with more than three
  # Ts are common; this only limits how many are reported, and the tightest
  # (final) one always supplies the pivot. The base's real boundary comes from
  # the rising-low and base-height rules below, so this is only a safety cap.
  max_contractions: 15

  # How far below the pivot a consolidation may sit and still belong to the
  # same base. A base is a region price ranges in, not a whole advance: RVMD's
  # walk ran back six months down a 91 -> 224 uptrend and collected pullbacks
  # from 44% lower as if they were part of one base. Highs may still ascend
  # across a base - the reference chart steps 70 -> 72 -> 74 - but by a few
  # percent, nothing like the run-up itself.
  max_base_height_pct: 25.0

  # The step a contraction must make to count as narrowing rather than
  # widening. Nothing is dropped from a base for failing it - the run is
  # consecutive - but a step above this ratio is marked as a widening one and
  # costs the base its "perfect VCP" standing.
  # 1.0 = "merely narrower"; lower demands a bigger step down each time.
  #
  # Set from the reference example rather than by taste: a textbook base
  # tightening 6.7% -> 6.0% -> 3.8% steps by ratios of 0.90 and 0.63. At 0.85
  # the first of those pairs is rejected and the base reads as two
  # consolidations instead of three, so 0.85 was stricter than the pattern it
  # was meant to describe.
  #
  # 1.0 means "narrower than the last", which is what the rule says. 0.95 was
  # stricter than that and rejected genuine sequences on a hair: KMX contracts
  # 8.06% -> 7.83%, a ratio of 0.971, and at 0.95 that consolidation was
  # dropped from the base entirely.
  #
  # Criterion 5 states the ideal as each contraction being at most half the
  # previous. That is an ideal, not a requirement - the reference base itself
  # only manages 0.90 on its first step - so it is reported, not enforced.
  contraction_shrink_factor: 1.0
  preferred_shrink_factor: 0.5

  # "Price never goes below B again" - each consolidation low must sit at or
  # above the previous one.
  require_higher_lows: true
  higher_low_tolerance_pct: 0.5

  # T1 is allowed to be deep, the final T must be tight (the ~4-8% pivot zone,
  # widened slightly so real setups are not lost on rounding).
  # Criterion 2: the first consolidation may not exceed 50%, ideally 30%. A
  # fall beyond 50% suggests stage 4 has not finished and this is not a base.
  max_first_depth_pct: 50.0
  preferred_first_depth_pct: 30.0
  # Criterion 7: the last consolidation's swing is essentially the risk, so it
  # tracks the risk ceiling exactly - (pivot - support) / pivot is the same
  # number as the final contraction's depth.
  final_depth_min_pct: 2.0
  final_depth_max_pct: 8.0
  preferred_final_depth_pct: 5.0

  # Volume must fall from one contraction to the next (high -> medium -> low).
  require_volume_contraction: true
  volume_shrink_factor: 1.0

  # Volume dry-up in the final consolidation: that contraction's own average
  # volume against the 50-day average as it stood at the contraction's low.
  # Measured over the contraction rather than the trailing sessions, so a
  # breakout's volume surge cannot destroy the reading.
  dryup_ratio: 0.85
  # Display only - how quiet the last few sessions have been.
  dryup_days: 5

  # The final low has to hold for a few bars before the consolidation counts
  # as finished.
  min_bars_since_final_low: 3

  # Only report names still near their pivot.
  max_distance_below_pivot_pct: 15.0
  # Once price is this far above the pivot the entry is gone - the name is
  # extended, not actionable.
  max_extended_above_pivot_pct: 5.0

  # The stop goes a little under the support line rather than exactly on it.
  # A stop sitting on the low to the cent is taken out by any wick that
  # matches the prior low, which is a common way to be shaken out of a base
  # that then works.
  stop_buffer_dollars: 0.10

  # How far above the pivot is still worth paying. Chasing further than this
  # gives up too much of the move before the trade even starts.
  max_entry_above_pivot_pct: 5.0
  # A breakout counts when price clears the pivot on this multiple of the
  # 50-day average volume. Reported for context; a stock that has already
  # cleared its pivot is a missed entry, not a candidate.
  breakout_volume_multiple: 1.5
  # How far a session may pierce the pivot before the entry counts as gone.
  # 0 means any trade above the pivot has taken it.
  pivot_break_tolerance_pct: 0.0

# ---------------------------------------------------------------------------
# Risk / reward.
# ---------------------------------------------------------------------------
risk:
  # Risk = (pivot - support) / pivot.
  #
  # Two tiers. The hard ceiling rejects a setup outright; the preferred ceiling
  # is what a good setup looks like. Anything between the two is shown but
  # marked subpar, in amber rather than green, so a wider stop is a deliberate
  # choice rather than something that slips through unnoticed.
  max_risk_pct: 8.0
  preferred_max_risk_pct: 5.0

  # Reward target: measured move = pivot + (base high - base low).
  target_method: measured_move
  min_reward_risk: 2.0
  preferred_reward_risk: 3.0

output:
  # Series data (for the charts) is written for at most this many names.
  max_series: 400
  # Two years of sessions, so the weekly chart has ~104 candles to show.
  series_bars: 520
  # Names that pass Stage 2 but have no valid VCP are still listed, capped here.
  max_stage2_only: 600
