name: Intraday quotes

# Five minutes is the floor GitHub's scheduler offers, and scheduled runs are
# routinely delayed under load, so treat this as "about every 5-15 minutes
# during market hours" rather than a guarantee. 13:30-20:00 UTC covers the US
# session while the east coast is on daylight time.
on:
  schedule:
    - cron: "*/5 13-20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: quotes
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The published lists come from the last scan's output, not from a
      # rescan: the pattern cannot change during the session.
      - name: Restore last scan output
        uses: actions/cache/restore@v4
        with:
          path: docs/data
          key: scan-output-
          restore-keys: scan-output-

      - name: Refresh quotes
        run: python tools/refresh_quotes.py
        env:
          PYTHONPATH: .

      # Published to a standalone branch that is force-replaced each run, not
      # to this one. Two reasons: a 5-minute commit would add ~80 commits a
      # day to the branch history, and it would race the nightly scan's own
      # commit. The branch holds exactly one file and one commit.
      - name: Publish quotes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s state/quotes.json || { echo "no quotes written"; exit 1; }
          work=$(mktemp -d)
          cp state/quotes.json "$work/quotes.json"
          cd "$work"
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          git commit -qm "Quotes $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
            HEAD:refs/heads/quotes-feed
          echo "published to quotes-feed"
