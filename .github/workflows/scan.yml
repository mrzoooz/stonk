name: Nightly scan

on:
  schedule:
    # 23:30 UTC Mon-Fri = 19:30 ET, a few hours after the US close so the
    # daily bars have settled. GitHub only runs schedules on the DEFAULT
    # branch - see README.
    - cron: "30 23 * * 1-5"
    # Morning safety net in case the evening run was dropped by the scheduler.
    - cron: "30 11 * * 2-6"
  workflow_dispatch:
    inputs:
      limit:
        description: "Cap the universe (0 = full scan). Useful for a quick test."
        required: false
        default: "0"
      force_full:
        description: "Refetch full history instead of topping up the cache"
        type: boolean
        required: false
        default: false

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  # contents: write is needed only for the heartbeat commit below, which keeps
  # the cron schedule from being auto-disabled.
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The price cache makes a nightly run cheap: without it every symbol
      # needs a full two-year backfill.
      - name: Restore price cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: prices-${{ github.run_id }}
          restore-keys: |
            prices-

      - name: Run screen
        run: |
          python -m screener.run \
            --limit "${{ github.event.inputs.limit || 0 }}" \
            ${{ github.event.inputs.force_full == 'true' && '--force-full' || '' }}

      - name: Save price cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: prices-${{ github.run_id }}

      # GitHub disables scheduled workflows after 60 days of repository
      # inactivity, and deploying Pages from an artifact leaves no commits
      # behind. Recording each scan's result keeps the repo active, so the
      # schedule stays alive, and gives a history of what ran when.
      - name: Record scan result
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          set -euo pipefail
          [ -f docs/data/meta.json ] || exit 0
          mkdir -p state
          cp docs/data/meta.json state/last-scan.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last-scan.json
          if git diff --cached --quiet; then
            echo "no change to record"
            exit 0
          fi
          git commit -m "Record scan $(date -u +%Y-%m-%d)"
          # Another run may have landed first; rebase rather than fail the scan.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Lets the deploy-only workflow republish the latest results without
      # re-running a scan.
      - name: Cache scan output
        if: always()
        uses: actions/cache/save@v4
        with:
          path: docs/data
          key: scan-output-${{ github.run_id }}

      - name: Summarise
        if: always()
        run: |
          if [ -f docs/data/meta.json ]; then
            {
              echo '### Scan result'
              echo '```json'
              cat docs/data/meta.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # enablement turns Pages on via the API on the first run, so the repo
      # does not need the Settings -> Pages click before the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
