name: Probe data sources

# Diagnostic only: prints what each free data source replies with from a
# runner, so provider choice is based on evidence.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/probe_sources.py
      - run: python tools/probe_candidates.py
        if: always()
      - run: python tools/probe_splits.py
        if: always()
