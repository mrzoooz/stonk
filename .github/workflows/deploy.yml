name: Deploy site

# Publishes docs/ to Pages without running a scan. Useful for front-end changes,
# and for restoring the site quickly after a Pages settings change discards the
# previous deployment.
#
# It does NOT produce data/: that is generated by the nightly scan and is
# deliberately not committed. Deploying alone therefore shows the app shell with
# "no data yet" until the next scan publishes results over it.

on:
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Reuse the most recent scan output if a cached copy is available, so a
      # bare deploy is not necessarily an empty one.
      - name: Restore last scan output
        uses: actions/cache/restore@v4
        with:
          path: docs/data
          key: scan-output-
          restore-keys: |
            scan-output-

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      # deploy-pages asks the artifact API for the artifact about half a second
      # after the upload returns, and that API is not read-your-writes: twice
      # in two months it answered "no artifacts named github-pages" for a file
      # that had just uploaded cleanly, failing a scan that had otherwise
      # worked. Wait for the artifact to actually be visible before deploying.
      - name: Wait for the Pages artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 20); do
            if gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                 --jq '.artifacts[].name' 2>/dev/null | grep -qx 'github-pages'; then
              echo "artifact visible after ${i} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "artifact never became visible" >&2
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
