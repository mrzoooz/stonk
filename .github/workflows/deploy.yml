name: Deploy site

# Publishes docs/ to Pages without running a scan. Useful for front-end changes,
# and for restoring the site quickly after a Pages settings change discards the
# previous deployment.
#
# It does NOT produce data/: that is generated by the nightly scan and is
# deliberately not committed. Deploying alone therefore shows the app shell with
# "no data yet" until the next scan publishes results over it.

on:
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.try1.outputs.page_url || steps.try2.outputs.page_url || steps.try3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Reuse the most recent scan output if a cached copy is available, so a
      # bare deploy is not necessarily an empty one.
      - name: Restore last scan output
        uses: actions/cache/restore@v4
        with:
          path: docs/data
          key: scan-output-
          restore-keys: |
            scan-output-

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      # Retried rather than waited on: the lookup deploy-pages uses is not
      # the REST endpoint this workflow can poll, so no pre-check here proves
      # anything. See scan.yml for the full note.
      - id: try1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - if: steps.try1.outcome == 'failure'
        run: sleep 30
      - id: try2
        if: steps.try1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        run: sleep 60
      - id: try3
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        uses: actions/deploy-pages@v4
