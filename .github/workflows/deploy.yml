name: Deploy site

# Publishes docs/ to Pages without running a scan. Useful for front-end changes,
# and for restoring the site quickly after a Pages settings change discards the
# previous deployment.
#
# It does NOT produce data/: that is generated by the nightly scan and is
# deliberately not committed. Deploying alone therefore shows the app shell with
# "no data yet" until the next scan publishes results over it.

on:
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Reuse the most recent scan output if a cached copy is available, so a
      # bare deploy is not necessarily an empty one.
      - name: Restore last scan output
        uses: actions/cache/restore@v4
        with:
          path: docs/data
          key: scan-output-
          restore-keys: |
            scan-output-

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
